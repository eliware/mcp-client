name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm -g install npm@latest
      - run: npm ci
      - run: npm test
      - run: >-
          node -e 'const major = Number(require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).split(".")[0]); if (major < 12) process.exit(1)'
